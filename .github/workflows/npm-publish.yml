name: Publish to NPM

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Verify tarball includes config
        run: |
          npm pack --dry-run | grep -q 'config/aiDevToolsPaths.js'
          PACK=$(npm pack)
          mkdir pack-test && cd pack-test
          npm init -y >/dev/null 2>&1
          npm install "../$PACK"
          node -e "require('./node_modules/@codelynther/dclean/src/scanners/aiDevTools.js')"

      - name: Publish @codelynther/dclean
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish dclean alias
        working-directory: packages/dclean
        run: |
          npm install
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
